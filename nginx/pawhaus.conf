# Nginx reverse proxy voor de Pawhaus (Next.js op 127.0.0.1:3000).
# Plaats dit bestand op de VPS in /etc/nginx/sites-available/ en symlink het
# naar sites-enabled/. Vervang "jouwdomein.be" door je eigen domein.
#
# Certbot vult na "certbot --nginx" automatisch de SSL-regels aan.

upstream pawhaus {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jouwdomein.be www.jouwdomein.be;

    # Let's Encrypt ACME-challenge (voor het genereren van certificaten).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Na het genereren van SSL stuurt Certbot HTTP door naar HTTPS.
    location / {
        proxy_pass http://pawhaus;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Statische Next.js assets agressief cachen.
    location /_next/static/ {
        proxy_pass http://pawhaus;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 10M;
}
